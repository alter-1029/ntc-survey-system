<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recover Admin Account &mdash; NTC</title>
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body>
  <main class="recovery-shell">
    <section class="card recovery-card" aria-labelledby="recovery-heading">
      <a class="recovery-brand" href="login.html">
        <img src="https://formsphilippines.com/agencylogo/28.png" alt="NTC logo" />
        <span>NTC Admin</span>
      </a>
      <p class="settings-eyebrow">ACCOUNT RECOVERY</p>
      <h1 id="recovery-heading">Reset your password</h1>
      <p class="recovery-intro">Enter the administrator email configured for this system. We&rsquo;ll send a time-limited reset link if the address is eligible.</p>

      <div id="forgot-password-message" class="settings-form-message" role="status" aria-live="polite" hidden></div>
      <form id="forgot-password-form">
        <div class="field">
          <label for="recovery-email">Administrator email</label>
          <input id="recovery-email" name="email" type="email" autocomplete="email" required />
        </div>
        <button id="recovery-submit" class="btn btn-primary btn-block" type="submit">Send reset link</button>
      </form>
      <a class="recovery-back" href="login.html">Back to sign in</a>
    </section>
  </main>

  <script src="../js/services/api.js"></script>
  <script src="../js/admin/forgotPassword.js"></script>
</body>
</html>
