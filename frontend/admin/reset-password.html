<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Choose a New Password &mdash; NTC</title>
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body>
  <main class="recovery-shell">
    <section class="card recovery-card" aria-labelledby="reset-heading">
      <a class="recovery-brand" href="login.html">
        <img src="https://formsphilippines.com/agencylogo/28.png" alt="NTC logo" />
        <span>NTC Admin</span>
      </a>
      <p class="settings-eyebrow">SECURE YOUR ACCOUNT</p>
      <h1 id="reset-heading">Choose a new password</h1>
      <p class="recovery-intro">Use at least 12 characters. This reset link can only be used once.</p>

      <div id="reset-password-message" class="settings-form-message" role="status" aria-live="polite" hidden></div>
      <form id="reset-password-form">
        <div class="field">
          <label for="reset-new-password">New password</label>
          <input id="reset-new-password" name="newPassword" type="password" autocomplete="new-password" minlength="12" required />
        </div>
        <div class="field">
          <label for="reset-confirm-password">Confirm new password</label>
          <input id="reset-confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="12" required />
        </div>
        <button id="reset-submit" class="btn btn-primary btn-block" type="submit">Update password</button>
      </form>
      <a class="recovery-back" href="login.html">Back to sign in</a>
    </section>
  </main>

  <script src="../js/services/api.js"></script>
  <script src="../js/admin/resetPassword.js"></script>
</body>
</html>
